services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.sample
    command: uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000}
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.sample
    command: npm run dev -- --hostname 0.0.0.0 --port ${FRONTEND_PORT:-3000}
