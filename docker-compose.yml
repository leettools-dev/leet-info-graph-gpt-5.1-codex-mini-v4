version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.sample
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000}
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - .env.sample
    command: npm run dev -- --hostname 0.0.0.0 --port ${FRONTEND_PORT:-3000}
