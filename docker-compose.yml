services:
  backend:
    build:
      context: ./backend
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000}
  frontend:
    build:
      context: ./frontend
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    env_file:
      - .env
    depends_on:
      - backend
    command: npm run dev -- --hostname 0.0.0.0 --port ${FRONTEND_PORT:-3000}
