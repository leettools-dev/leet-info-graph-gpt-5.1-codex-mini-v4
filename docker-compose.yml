version: '3.9'
services:
  backend:
    build:
      context: ./backend
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    env_file:
      - .env
    depends_on:
      - frontend
  frontend:
    build:
      context: ./frontend
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    env_file:
      - .env
